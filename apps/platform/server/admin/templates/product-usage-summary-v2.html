<!doctype html>
  <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Usage Summary</title>
      <style>
        * { box-sizing: border-box; }
        :root {
          --usage-bg: #000;
          --usage-panel: rgba(255,255,255,0.05);
          --usage-panel-strong: rgba(255,255,255,0.08);
          --usage-border: rgba(255,255,255,0.1);
          --usage-border-soft: rgba(255,255,255,0.06);
          --usage-text: rgba(255,255,255,0.94);
          --usage-muted: rgba(255,255,255,0.52);
          --usage-faint: rgba(255,255,255,0.34);
          --usage-blue: #66a6ff;
          --usage-green: #45d483;
          --usage-yellow: #ffe717;
          --usage-purple: #8f7cff;
          --usage-pink: #ff6fb7;
        }
        html,
        body {
          height: 100%;
          min-height: 100%;
        }
        body {
          margin: 0;
          min-height: 100vh;
          background:
            radial-gradient(circle at 28% 0%, rgba(102,166,255,0.08), transparent 30%),
            radial-gradient(circle at 94% 10%, rgba(143,124,255,0.06), transparent 24%),
            #000;
          color: var(--usage-text);
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          overflow: hidden;
        }
        button,
        input {
          font: inherit;
        }
        button {
          color: inherit;
        }
        .usage-app-shell {
          display: grid;
          grid-template-columns: 244px minmax(0, 1fr);
          height: 100vh;
          min-height: 100vh;
          min-width: 0;
          width: 100vw;
          overflow: hidden;
        }
        .usage-sidebar {
          display: flex;
          flex-direction: column;
          min-width: 0;
          border-right: 1px solid var(--usage-border);
          background: rgba(13,13,13,0.86);
          backdrop-filter: blur(20px);
        }
        .usage-sidebar-header {
          display: flex;
          align-items: center;
          gap: 10px;
          min-height: 78px;
          padding: 0 18px;
          border-bottom: 1px solid var(--usage-border);
        }
        .usage-sidebar-logo {
          display: grid;
          place-items: center;
          width: 30px;
          height: 30px;
          border-radius: 9px;
          background: rgba(255,255,255,0.08);
          color: white;
          font-size: 14px;
          font-weight: 600;
        }
        .usage-sidebar-title {
          min-width: 0;
        }
        .usage-sidebar-title strong {
          display: block;
          font-size: 13px;
          line-height: 1.2;
          font-weight: 500;
        }
        .usage-sidebar-title span {
          display: block;
          margin-top: 2px;
          color: var(--usage-muted);
          font-size: 11px;
          line-height: 1.2;
        }
        .usage-sidebar-nav {
          display: flex;
          flex-direction: column;
          gap: 3px;
          padding: 14px 10px;
          overflow-y: auto;
        }
        .usage-sidebar-link {
          display: flex;
          align-items: center;
          gap: 10px;
          width: 100%;
          min-height: 34px;
          border: 0;
          border-radius: 8px;
          background: transparent;
          color: rgba(255,255,255,0.62);
          padding: 0 10px;
          text-align: left;
          cursor: pointer;
        }
        .usage-sidebar-link:hover {
          background: rgba(255,255,255,0.07);
          color: rgba(255,255,255,0.9);
        }
        .usage-sidebar-link.is-active {
          background: rgba(255,255,255,0.1);
          color: white;
        }
        .usage-sidebar-icon {
          display: grid;
          place-items: center;
          width: 17px;
          height: 17px;
          color: currentColor;
          opacity: 0.86;
        }
        .usage-sidebar-link span:last-child {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          font-size: 12px;
          font-weight: 400;
        }
        .usage-app-main {
          display: grid;
          grid-template-rows: 78px minmax(0, 1fr);
          min-width: 0;
          min-height: 0;
          height: 100vh;
          min-height: 100vh;
          overflow: hidden;
        }
        .usage-top-nav {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          align-items: center;
          gap: 18px;
          min-width: 0;
          border-bottom: 1px solid var(--usage-border);
          background: rgba(0,0,0,0.72);
          backdrop-filter: blur(18px);
          padding: 0 42px;
        }
        .usage-top-left {
          display: flex;
          align-items: center;
          min-width: 0;
          gap: 10px;
        }
        .usage-sidebar-toggle {
          display: grid;
          place-items: center;
          width: 32px;
          height: 32px;
          border: 0;
          border-radius: 999px;
          background: transparent;
          color: rgba(255,255,255,0.65);
          padding: 0;
        }
        .usage-breadcrumb {
          display: flex;
          align-items: center;
          gap: 8px;
          min-width: 0;
          font-size: 12px;
          color: rgba(255,255,255,0.46);
        }
        .usage-breadcrumb strong {
          color: white;
          font-weight: 500;
        }
        .usage-top-actions {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .usage-timeframe-switch {
          display: inline-flex;
          align-items: center;
          gap: 2px;
          height: 34px;
          padding: 2px;
          border: 1px solid var(--usage-border);
          border-radius: 999px;
          background: rgba(255,255,255,0.04);
        }
        .usage-timeframe-button {
          height: 28px;
          min-width: 42px;
          border: 0;
          border-radius: 999px;
          background: transparent;
          color: rgba(255,255,255,0.62);
          padding: 0 11px;
          font-size: 12px;
          line-height: 1;
          cursor: pointer;
        }
        .usage-timeframe-button:hover {
          color: rgba(255,255,255,0.9);
        }
        .usage-timeframe-button.is-active {
          background: rgba(255,255,255,0.2);
          color: white;
        }
        .usage-refresh-button {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 7px;
          height: 34px;
          border: 1px solid var(--usage-border);
          border-radius: 999px;
          background: rgba(255,255,255,0.04);
          color: rgba(255,255,255,0.82);
          padding: 0 13px;
          font-size: 12px;
          cursor: pointer;
        }
        .usage-refresh-button:hover {
          background: rgba(255,255,255,0.09);
        }
        .usage-refresh-button:disabled {
          opacity: 0.56;
          cursor: default;
        }
        .usage-content-scroll {
          min-width: 0;
          min-height: 0;
          overflow: auto;
          -webkit-overflow-scrolling: touch;
          padding: 24px 42px 52px;
        }
        .usage-content {
          display: flex;
          flex-direction: column;
          gap: 18px;
          max-width: 1500px;
          min-height: 100%;
          margin: 0 auto;
        }
        .usage-page-header {
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          gap: 16px;
          min-width: 0;
        }
        .usage-page-title {
          margin: 0;
          font-size: 22px;
          line-height: 1.08;
          font-weight: 500;
          letter-spacing: 0;
        }
        .usage-page-copy {
          margin: 7px 0 0;
          color: var(--usage-muted);
          font-size: 12px;
          line-height: 1.45;
        }
        .usage-status {
          min-height: 17px;
          color: var(--usage-muted);
          font-size: 12px;
          text-align: right;
        }
        .usage-status.is-error {
          color: #ffb4b4;
        }
        .usage-kpi-grid {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 10px;
        }
        .usage-kpi-card,
        .usage-chart-card,
        .usage-table-card {
          position: relative;
          background: rgba(255,255,255,0.05);
          border-radius: 13px;
          overflow: hidden;
        }
        .usage-kpi-card::before,
        .usage-chart-card::before,
        .usage-table-card::before {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: inherit;
          padding: 1px;
          background: linear-gradient(135deg, rgba(255,255,255,0.26), rgba(255,255,255,0.04) 46%, rgba(255,255,255,0.1));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
          mask-composite: exclude;
          pointer-events: none;
        }
        .usage-kpi-card {
          min-height: 102px;
          padding: 14px;
        }
        .usage-kpi-label {
          color: var(--usage-muted);
          font-size: 11px;
          line-height: 1.2;
        }
        .usage-kpi-value {
          margin-top: 11px;
          font-size: 26px;
          line-height: 1;
          font-weight: 500;
        }
        .usage-kpi-hint {
          margin-top: 8px;
          color: var(--usage-faint);
          font-size: 11px;
          line-height: 1.28;
        }
        .usage-chart-grid {
          display: grid;
          grid-template-columns: minmax(0, 1.35fr) minmax(340px, 0.65fr);
          gap: 12px;
        }
        .usage-chart-card {
          min-height: 354px;
        }
        .usage-chart-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          padding: 16px 18px 0;
        }
        .usage-chart-title {
          font-size: 14px;
          font-weight: 500;
        }
        .usage-chart-note {
          color: var(--usage-muted);
          font-size: 11px;
          text-align: right;
        }
        .usage-chart-frame {
          height: 274px;
          padding: 16px 16px 14px;
        }
        .usage-breakdown-list {
          display: flex;
          flex-direction: column;
          gap: 0;
          padding: 10px 18px 18px;
        }
        .usage-breakdown-row {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 14px;
          align-items: center;
          padding: 10px 0;
          border-bottom: 1px solid rgba(255,255,255,0.07);
        }
        .usage-breakdown-row:last-child {
          border-bottom: 0;
        }
        .usage-breakdown-title {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          color: rgba(255,255,255,0.84);
          font-size: 12px;
        }
        .usage-breakdown-meta {
          margin-top: 4px;
          color: var(--usage-muted);
          font-size: 11px;
        }
        .usage-breakdown-track {
          height: 4px;
          margin-top: 8px;
          border-radius: 999px;
          background: rgba(255,255,255,0.08);
          overflow: hidden;
        }
        .usage-breakdown-fill {
          height: 100%;
          min-width: 3px;
          border-radius: inherit;
          background: linear-gradient(90deg, var(--usage-blue), rgba(102,166,255,0.28));
        }
        .usage-breakdown-value {
          color: rgba(255,255,255,0.82);
          font-size: 12px;
        }
        .usage-table-card {
          min-height: 0;
        }
        .usage-table-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          min-height: 54px;
          padding: 0 18px;
          border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .usage-table-title {
          font-size: 14px;
          font-weight: 500;
        }
        .usage-table-wrap {
          overflow-x: auto;
        }
        table {
          width: 100%;
          border-collapse: collapse;
          font-size: 12px;
        }
        th,
        td {
          padding: 12px 14px;
          border-bottom: 1px solid rgba(255,255,255,0.07);
          text-align: left;
          white-space: nowrap;
        }
        th {
          color: var(--usage-muted);
          font-size: 11px;
          font-weight: 400;
        }
        td {
          color: rgba(255,255,255,0.84);
        }
        tr:last-child td {
          border-bottom: 0;
        }
        .usage-muted-cell {
          color: var(--usage-muted);
        }
        .usage-wide-cell {
          min-width: 260px;
          max-width: 520px;
          white-space: normal;
          line-height: 1.4;
        }
        .usage-pill {
          display: inline-flex;
          align-items: center;
          height: 22px;
          border-radius: 999px;
          background: rgba(255,255,255,0.08);
          color: rgba(255,255,255,0.72);
          padding: 0 8px;
          font-size: 11px;
          text-transform: capitalize;
        }
        .usage-empty {
          display: grid;
          place-items: center;
          min-height: 184px;
          color: var(--usage-muted);
          font-size: 12px;
          text-align: center;
        }
        .usage-loading {
          display: grid;
          place-items: center;
          min-height: 274px;
        }
        .usage-dot-loader {
          display: grid;
          grid-template-columns: repeat(3, 4px);
          gap: 3px;
        }
        .usage-dot-loader span {
          width: 4px;
          height: 4px;
          border-radius: 999px;
          background: rgba(255,255,255,0.68);
          animation: usage-dot-pulse 0.9s ease-in-out infinite;
        }
        .usage-dot-loader span:nth-child(2) { animation-delay: 0.12s; }
        .usage-dot-loader span:nth-child(3) { animation-delay: 0.24s; }
        @keyframes usage-dot-pulse {
          0%, 80%, 100% { transform: translateY(0); opacity: 0.42; }
          40% { transform: translateY(-4px); opacity: 1; }
        }
        @media (max-width: 1120px) {
          .usage-app-shell {
            grid-template-columns: 76px minmax(0, 1fr);
          }
          .usage-sidebar-title,
          .usage-sidebar-link span:last-child {
            display: none;
          }
          .usage-sidebar-header {
            justify-content: center;
            padding: 0;
          }
          .usage-sidebar-nav {
            align-items: center;
          }
          .usage-sidebar-link {
            justify-content: center;
            width: 44px;
            padding: 0;
          }
        }
        @media (max-width: 960px) {
          .usage-top-nav,
          .usage-content-scroll {
            padding-left: 20px;
            padding-right: 20px;
          }
          .usage-kpi-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }
          .usage-chart-grid {
            grid-template-columns: 1fr;
          }
        }
        @media (max-width: 680px) {
          body {
            overflow: auto;
          }
          .usage-app-shell {
            grid-template-columns: 1fr;
          }
          .usage-sidebar {
            display: none;
          }
          .usage-app-main {
            min-height: 100vh;
          }
          .usage-top-nav {
            grid-template-columns: 1fr;
            min-height: auto;
            padding-top: 14px;
            padding-bottom: 14px;
          }
          .usage-top-actions {
            justify-content: space-between;
          }
          .usage-kpi-grid {
            grid-template-columns: 1fr;
          }
        }
      </style>
    </head>
    <body>
      <div class="usage-app-shell">
        <aside class="usage-sidebar" aria-label="Usage summary navigation">
          <div class="usage-sidebar-header">
            <div class="usage-sidebar-logo">CA</div>
            <div class="usage-sidebar-title">
              <strong>Computer Agents</strong>
              <span>Usage Summary</span>
            </div>
          </div>
          <nav class="usage-sidebar-nav" id="usage-sidebar-nav"></nav>
        </aside>
        <div class="usage-app-main">
          <header class="usage-top-nav">
            <div class="usage-top-left">
              <button type="button" class="usage-sidebar-toggle" aria-label="Sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M9 4v16" stroke="currentColor" stroke-width="1.7"/></svg>
              </button>
              <div class="usage-breadcrumb">
                <span>Admin</span>
                <span>›</span>
                <strong id="usage-breadcrumb-current">Overview</strong>
              </div>
            </div>
            <div class="usage-top-actions">
              <div class="usage-timeframe-switch" role="tablist" aria-label="Time frame">
                <button type="button" class="usage-timeframe-button" data-days="3">3d</button>
                <button type="button" class="usage-timeframe-button is-active" data-days="7">7d</button>
                <button type="button" class="usage-timeframe-button" data-days="14">14d</button>
                <button type="button" class="usage-timeframe-button" data-days="30">30d</button>
              </div>
              <button type="button" class="usage-refresh-button" id="usage-refresh">Refresh</button>
            </div>
          </header>
          <main class="usage-content-scroll">
            <div class="usage-content">
              <div class="usage-page-header">
                <div>
                  <h1 class="usage-page-title" id="usage-page-title">Overview</h1>
                  <p class="usage-page-copy" id="usage-page-copy">Product activity, retention, and resource creation across the platform.</p>
                </div>
                <div id="usage-status" class="usage-status">Checking session...</div>
              </div>
              <div class="usage-kpi-grid" id="usage-kpis"></div>
              <div class="usage-chart-grid">
                <section class="usage-chart-card">
                  <div class="usage-chart-header">
                    <div class="usage-chart-title" id="usage-primary-title">Usage trend</div>
                    <div class="usage-chart-note" id="usage-primary-note">Daily activity</div>
                  </div>
                  <div class="usage-chart-frame" id="usage-primary-chart-frame">
                    <canvas id="usage-primary-chart" aria-label="Usage trend chart"></canvas>
                  </div>
                </section>
                <section class="usage-chart-card">
                  <div class="usage-chart-header">
                    <div class="usage-chart-title" id="usage-breakdown-title">Breakdown</div>
                    <div class="usage-chart-note" id="usage-breakdown-note">Top signals</div>
                  </div>
                  <div class="usage-breakdown-list" id="usage-breakdown-list"></div>
                </section>
              </div>
              <section class="usage-table-card">
                <div class="usage-table-header">
                  <div class="usage-table-title" id="usage-table-title">Most Active Users</div>
                  <div class="usage-chart-note" id="usage-table-note">Sorted by product activity</div>
                </div>
                <div class="usage-table-wrap" id="usage-table-wrap"></div>
              </section>
            </div>
          </main>
        </div>
      </div>
      <script type="module">
        const AIOS_ORIGIN = __PLATFORM_AIOS_ORIGIN_JSON__;
        let ChartConstructor = null;
        let chartConstructorPromise = null;
        let chartRenderSequence = 0;
  
        function loadChartConstructor() {
          if (ChartConstructor) return Promise.resolve(ChartConstructor);
          if (!chartConstructorPromise) {
            chartConstructorPromise = import("https://esm.sh/chart.js@4.5.1/auto?bundle")
              .then(function(module) {
                ChartConstructor = module.default || module.Chart;
                return ChartConstructor;
              });
          }
          return chartConstructorPromise;
        }
  
        const navItems = [
          { id: "overview", label: "Overview", icon: "dashboard" },
          { id: "users", label: "Users", icon: "users" },
          { id: "threads", label: "Threads", icon: "thread" },
          { id: "agents", label: "Agents", icon: "bot" },
          { id: "computers", label: "Computers", icon: "computer" },
          { id: "projects", label: "Projects", icon: "project" },
          { id: "metronome", label: "Metronome", icon: "metronome" },
          { id: "resources", label: "Resources", icon: "resources" },
          { id: "calendar", label: "Calendar", icon: "calendar" },
          { id: "teams", label: "Teams", icon: "teams" },
          { id: "models", label: "Models", icon: "models" },
          { id: "sales", label: "Sales", icon: "sales" },
          { id: "feedback", label: "Feedback", icon: "feedback" },
        ];
        const sectionConfig = {
          overview: {
            title: "Overview",
            copy: "Product activity, retention, and resource creation across the platform.",
            primaryTitle: "Platform Activity",
            primaryNote: "Users, returners, and threads",
            breakdownTitle: "Feature Usage",
            breakdownNote: "Most used surfaces",
            chartSeries: [
              { key: "activeUsers", label: "Active users", color: "#66a6ff", type: "line" },
              { key: "returningUsers", label: "Returning users", color: "#45d483", type: "line" },
              { key: "threadsStarted", label: "Threads", color: "#ffe717", type: "bar" },
            ],
            kpis: [
              ["New users", "summary.newUsers", "Accounts created"],
              ["Active users", "summary.activeUsers", "Users with activity"],
              ["Returning users", "summary.returningUsers", "Return rate", "summary.returnRate", "percent"],
              ["Threads", "summary.threadsStarted", "Started in period"],
            ],
            breakdown: "features",
            table: "users",
          },
          users: {
            title: "Users",
            copy: "Account creation, active users, retention, and user-level engagement.",
            primaryTitle: "User Trend",
            primaryNote: "Daily user activity",
            breakdownTitle: "Top Users",
            breakdownNote: "Sessions and active time",
            chartSeries: [
              { key: "newUsers", label: "New users", color: "#8f7cff", type: "bar" },
              { key: "activeUsers", label: "Active users", color: "#66a6ff", type: "line" },
              { key: "returningUsers", label: "Returning users", color: "#45d483", type: "line" },
            ],
            kpis: [
              ["New users", "summary.newUsers", "Created in period"],
              ["Active users", "summary.activeUsers", "Product activity"],
              ["Return rate", "summary.returnRate", "Returning / active", null, "percentMain"],
              ["Avg active time", "summary.avgActiveMinutes", "Per active user", null, "minutes"],
            ],
            breakdown: "users",
            table: "users",
          },
          threads: {
            title: "Threads",
            copy: "Thread creation, messages, failures, and permission waits.",
            primaryTitle: "Thread Activity",
            primaryNote: "Started threads and user messages",
            breakdownTitle: "Thread Health",
            breakdownNote: "Failures and permission waits",
            chartSeries: [
              { key: "threadsStarted", label: "Threads", color: "#66a6ff", type: "bar" },
              { key: "userMessages", label: "Messages", color: "#45d483", type: "line" },
              { key: "failedThreads", label: "Failures", color: "#ff6fb7", type: "line" },
            ],
            kpis: [
              ["Threads started", "summary.threadsStarted", "New threads"],
              ["Messages", "summary.userMessages", "User messages"],
              ["Failed threads", "health.failedThreads", "Failure rate", "health.failureRate", "percent"],
              ["Waiting permissions", "health.permissionWaitingThreads", "Approval required"],
            ],
            breakdown: "threadHealth",
            table: "users",
          },
          agents: {
            title: "Agents",
            copy: "Agent creation and agent-related product activity.",
            primaryTitle: "Agent Activity",
            primaryNote: "Agents created and threads started",
            breakdownTitle: "Agent Signals",
            breakdownNote: "Creation and usage",
            chartSeries: [
              { key: "agentsCreated", label: "Agents", color: "#66a6ff", type: "bar" },
              { key: "threadsStarted", label: "Threads", color: "#8f7cff", type: "line" },

            uniqueEmails: uniqueEmails.size,

        function buildSalesTrendRows(payload) {
          const rows = normalizeSalesSubmissions(payload || {});
          const buckets = new Map();
          const today = new Date();
          for (let index = currentDays - 1; index >= 0; index -= 1) {
            const date = new Date(today.getTime() - index * 24 * 60 * 60 * 1000);
            const key = date.toISOString().slice(0, 10);
            buckets.set(key, { date: key, count: 0 });
          }
          rows.forEach(function(row) {
            if (!row.createdAt) return;
            const date = new Date(row.createdAt);
            if (!Number.isFinite(date.getTime())) return;
            const key = date.toISOString().slice(0, 10);
            if (buckets.has(key)) {
              buckets.get(key).count += 1;

          });
          return Array.from(buckets.values());

                '<td class="usage-wide-cell">' + escapeHtml(row.goal || "—") + '</td>' +
                '<td class="usage-muted-cell">' + escapeHtml(row.source || "—") + '</td>' +
                '<td>' + formatDate(row.createdAt) + '</td>' +
              '</tr>';
            }).join("") +
            '</tbody></table>';
        }
  
        function renderTable(payload, config) {
          if (config.table === "sales") {
            tableTitleEl.textContent = "Contact Sales Inquiries";
            tableNoteEl.textContent = "Latest enterprise requests";
            tableWrapEl.innerHTML = renderSalesTable(payload || {});
            return;
          }
          if (config.table === "feedback") {
            tableTitleEl.textContent = "Recent Feedback";
            tableNoteEl.textContent = "Latest ratings and issue reports";
            tableWrapEl.innerHTML = renderFeedbackTable(payload || {});
            return;
          }
          if (config.table === "models") {
            tableTitleEl.textContent = "LLMs Used";
            tableNoteEl.textContent = "Actual model usage from user activity";
            tableWrapEl.innerHTML = renderModelTable(collectModelUsageRows(payload || {}));
            return;
          }
          if (config.table === "features") {
            tableTitleEl.textContent = "Feature Signals";
            tableNoteEl.textContent = "Aggregated product surfaces";
            const rows = config.breakdown === "serverKinds"
              ? (payload.serverKinds || []).map(function(row) {
                  return { label: String(row.kind || "unknown").replace(/_/g, " "), category: "Server type", count: row.count, users: row.users };
                })
              : (payload.featureUsage || []);
            tableWrapEl.innerHTML = renderFeatureTable(rows);
            return;
          }
          tableTitleEl.textContent = config.title === "Users" ? "Most Active Users" : "User Activity";
          tableNoteEl.textContent = "Sorted by product activity";
          tableWrapEl.innerHTML = renderUsersTable(payload.topUsers || []);
        }
  
        function renderPage() {
          if (!sectionConfig[activeSection]) activeSection = "overview";
          const config = sectionConfig[activeSection];
          const pagePayload = getActiveSectionPayload();
          const isLoading = isActiveSectionLoading();
          const loadError = getActiveSectionError();
          renderNav();
          updateRefreshState();
          titleEl.textContent = config.title;
          copyEl.textContent = config.copy;
          breadcrumbEl.textContent = config.title;
          primaryTitleEl.textContent = config.primaryTitle || "Usage Trend";
          primaryNoteEl.textContent = config.primaryNote || "Daily activity";
          breakdownTitleEl.textContent = config.breakdownTitle || "Breakdown";
          breakdownNoteEl.textContent = config.breakdownNote || "Top signals";
          if (isLoading || !pagePayload) {
            kpisEl.innerHTML = "";
            const message = isLoading ? "Loading usage data..." : (loadError || "No usage data loaded yet.");
            breakdownEl.innerHTML = '<div class="usage-empty">' + escapeHtml(message) + '</div>';
            tableTitleEl.textContent = "Details";
            tableNoteEl.textContent = "";
            tableWrapEl.innerHTML = '<div class="usage-empty">' + escapeHtml(message) + '</div>';
            if (isLoading) {
              renderLoadingChart();
            } else {
              destroyPrimaryChart();
              primaryChartFrameEl.innerHTML = '<div class="usage-empty">' + escapeHtml(message) + '</div>';
            }
            return;
          }
          const renderPayload = activeSection === "models"
            ? Object.assign({}, pagePayload, { modelSummary: buildModelSummary(pagePayload || {}) })
            : activeSection === "feedback"
              ? Object.assign({}, pagePayload, { feedbackSummary: buildFeedbackSummary(pagePayload || {}) })
              : activeSection === "sales"
                ? Object.assign({}, pagePayload, { salesSummary: buildSalesSummary(pagePayload || {}) })
                : pagePayload;
          renderKpis(renderPayload, config);
          void renderPrimaryChart(pagePayload, config);
          renderBreakdown(pagePayload, config);
          renderTable(pagePayload, config);
        }
  
        async function loadActiveSection(options) {
          if (!sectionConfig[activeSection]) activeSection = "overview";
          const section = activeSection;
          const key = getSectionCacheKey(section);
          const force = Boolean(options && options.force);
          if (!force && sectionPayloadCache.has(key)) {
            sectionErrorCache.delete(key);
            setStatus(getSectionLoadedText(section, sectionPayloadCache.get(key) || {}), false);
            renderPage();
            return;
          }
          if (!force && sectionLoadingKeys.has(key)) {
            renderPage();
            return;
          }
          sectionLoadingKeys.add(key);
          sectionErrorCache.delete(key);
          updateRefreshState();
          setStatus(getSectionLoadingText(section), false);
          renderPage();
          try {
            const response = await fetch(getSectionFetchUrl(section), {
              cache: "no-store",
              credentials: "include",
            });
            const payload = await response.json().catch(function() { return {}; });
            if (response.status === 401 || response.status === 403) {
              window.location.replace(payload.loginUrl || buildLoginUrl());
              return;
            }
            if (!response.ok) {
              throw new Error(payload.message || payload.error || "Failed to load " + (sectionConfig[section]?.title || "usage") + ".");
            }
            sectionPayloadCache.set(key, payload || {});
            if (getActiveSectionCacheKey() === key) {
              setStatus(getSectionLoadedText(section, payload || {}), false);
            }
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            sectionPayloadCache.delete(key);
            sectionErrorCache.set(key, message);
            if (getActiveSectionCacheKey() === key) {
              setStatus(message, true);
            }
          } finally {
            sectionLoadingKeys.delete(key);
            updateRefreshState();
            if (getActiveSectionCacheKey() === key) {
              renderPage();
            }
          }
        }
  
        document.querySelectorAll("[data-days]").forEach(function(button) {
          button.addEventListener("click", function() {
            currentDays = numberValue(button.getAttribute("data-days")) || 7;
            document.querySelectorAll("[data-days]").forEach(function(item) {
              item.classList.toggle("is-active", item === button);
            });
            void loadActiveSection({ force: isProductUsageSection(activeSection) });
          });
        });
        window.addEventListener("hashchange", function() {
          activeSection = window.location.hash ? window.location.hash.slice(1) : "overview";
          renderPage();
          void loadActiveSection();
        });
        refreshButton.addEventListener("click", function() {
          void loadActiveSection({ force: true });
        });
        renderNav();
        void loadActiveSection();
      </script>
    </body>
  </html>
